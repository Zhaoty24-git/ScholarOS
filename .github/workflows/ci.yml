name: ScholarOS Offline CI

on:
  push:
    branches: [main, codex/ci-offline-tests-pr2, codex/android-offline-apk-pr3, codex/agnes-ai-pr4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  python:
    name: Python offline regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'
      - name: Install hash-locked build and test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-ci-build.lock
          python -m pip install --index-url https://pypi.org/simple --require-hashes --no-build-isolation -r requirements-ci.lock
          python -m pip check
      - name: Record versions and validate workflow policy
        run: |
          python --version
          python -m pip list --format=freeze
          python scripts/check_ci_policy.py
      - name: Python syntax
        run: python -m compileall -q backend src scripts tests main.py
      - name: Offline security, business and isolation regressions
        run: python scripts/run_offline_tests.py
      - name: Architecture harness in isolated configuration
        run: python scripts/run_offline_tests.py --harness
      - name: Authorized and unauthorized API smoke
        run: python scripts/verify_e_module.py

  frontend:
    name: Frontend build and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'
      - name: Install hash-locked local browser driver
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-browser.lock
      - name: Artifact checker regressions
        run: node scripts/check_frontend_artifact.test.mjs
      - name: Clean npm ci, request tests, TypeScript and Vite
        run: node scripts/frontend_ci.mjs --output "$RUNNER_TEMP/scholaros-frontend-dist"
      - name: Local synthetic browser scenarios
        run: python tests/browser_security_smoke.py --browser google-chrome --dist "$RUNNER_TEMP/scholaros-frontend-dist"
      - name: Independent Android offline bundle
        run: node scripts/frontend_ci.mjs --android --output "$RUNNER_TEMP/scholaros-offline-dist"
      - name: Mobile offline navigation without backend or network
        run: python tests/browser_security_smoke.py --browser google-chrome --offline --dist "$RUNNER_TEMP/scholaros-offline-dist"
